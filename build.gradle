import com.replaymod.gradle.preprocess.Node
import groovy.json.JsonSlurper

plugins {
	id 'net.fabricmc.fabric-loom-remap' version '1.17.20' apply false
	id 'com.github.spotbugs' version '6.1.7' apply false
	id 'com.replaymod.preprocess-root' version '221276c7d4316055744c499bb66dbc5b9d0a508c'
}

apply from: file('gradle/quickcraft-layout.gradle')
layout.buildDirectory.set(quickcraftBuildRoot)

def versionMatrix = new JsonSlurper().parse(file('version-matrix.json'))

preprocess {
	strictExtraMappings = false

	final List<Node> versionNodes = []
	versionMatrix.tracks['1.21x'].versions.each { versionSpec ->
		def parts = versionSpec.project.split(/\./)
		def patchVersion = parts.length > 2 ? parts[2] : '0'
		def numericVersion = (parts[0] + parts[1].padLeft(2, '0') + patchVersion.padLeft(2, '0')).toInteger()
		versionNodes << createNode(versionSpec.project, numericVersion, '')
	}

	versionNodes.sort { it.mcVersion }
	for (int index = 0; index < versionNodes.size() - 1; index++) {
		def source = versionNodes[index]
		def target = versionNodes[index + 1]
		source.link target, null
	}
}

def minecraft121Projects = versionMatrix.tracks['1.21x'].versions.collect { ":${it.project}" }
def minecraft26Projects = versionMatrix.tracks['26x'].versions.collect { project(":${it.project}") }
def minecraft26Build = gradle.includedBuild('quickcraft-26x')

minecraft26Projects.each { proxyProject ->
	[
		'build': [group: 'build', description: "Build Minecraft ${proxyProject.name}."],
		'test': [group: 'verification', description: "Test Minecraft ${proxyProject.name}."],
		'runClient': [group: 'fabric', description: "Run the Minecraft ${proxyProject.name} client."],
		'runServer': [group: 'fabric', description: "Run the Minecraft ${proxyProject.name} server."],
		'clean': [group: 'build', description: "Clean generated outputs for Minecraft ${proxyProject.name}."]
	].each { taskName, taskSpec ->
		proxyProject.tasks.register(taskName) {
			group = taskSpec.group
			description = taskSpec.description
			dependsOn minecraft26Build.task(":${proxyProject.name}:${taskName}")
		}
	}
}

tasks.register('showWorkspaceLayout') {
	group = 'help'
	description = 'Show centralized build, run, artifact, and log locations.'
	doLast {
		println "Gradle user home: ${gradle.gradleUserHomeDir}"
		println "Gradle project cache: ${rootProject.file('.gradle')}"
		println "Build root: ${quickcraftBuildRoot}"
		println "Release Jars: ${new File(quickcraftBuildRoot, 'distributions')}"
		println "Run root: ${quickcraftRunRoot}"
		versionMatrix.tracks.values().each { track ->
			track.versions.each { versionSpec ->
				def target = versionSpec.project
				println "${target}:"
				println "  build: ${new File(quickcraftBuildRoot, "targets/${target}")}"
				println "  client: ${new File(quickcraftRunRoot, "${target}/client")}"
				println "  client log: ${new File(quickcraftRunRoot, "${target}/client/logs/latest.log")}"
				println "  server: ${new File(quickcraftRunRoot, "${target}/server")}"
			}
		}
	}
}

tasks.register('build121') {
	group = 'build'
	description = 'Build every supported Minecraft 1.21.x artifact.'
	dependsOn minecraft121Projects.collect { "${it}:build" }
}

tasks.register('test121') {
	group = 'verification'
	description = 'Run tests for every supported Minecraft 1.21.x artifact.'
	dependsOn minecraft121Projects.collect { "${it}:test" }
}

tasks.register('build26x') {
	group = 'build'
	description = 'Build the isolated Minecraft 26.x track with Java 25.'
	dependsOn minecraft26Build.task(':buildAll26x')
}

tasks.register('test26x') {
	group = 'verification'
	description = 'Run tests for the isolated Minecraft 26.x track.'
	dependsOn minecraft26Build.task(':testAll26x')
}

[
	'build2612': [task: ':26.1.2:build', description: 'Build Minecraft 26.1.2.'],
	'build262': [task: ':26.2:build', description: 'Build Minecraft 26.2.'],
	'build263': [task: ':26.3:build', description: 'Build Minecraft 26.3.'],
	'runClient2612': [task: ':26.1.2:runClient', description: 'Run the Minecraft 26.1.2 client.'],
	'runClient262': [task: ':26.2:runClient', description: 'Run the Minecraft 26.2 client.'],
	'runClient263': [task: ':26.3:runClient', description: 'Run the Minecraft 26.3 client.']
].each { taskName, target ->
	tasks.register(taskName) {
		group = 'minecraft 26.x'
		description = target.description
		dependsOn minecraft26Build.task(target.task)
	}
}

tasks.register('buildAllVersions') {
	group = 'build'
	description = 'Build every declared Minecraft version in both build tracks.'
	dependsOn 'build121', 'build26x'
}

tasks.register('collectArtifacts', Sync) {
	group = 'build'
	description = 'Build and collect one release Jar for every declared Minecraft target.'
	dependsOn 'buildAllVersions'
	into layout.buildDirectory.dir('distributions')
	duplicatesStrategy = DuplicatesStrategy.FAIL

	from(minecraft121Projects.collect { project(it).layout.buildDirectory.dir('libs') }) {
		include '*.jar'
		exclude '*-sources.jar'
	}
	from(versionMatrix.tracks['26x'].versions.collect { versionSpec ->
		new File(quickcraftBuildRoot, "targets/${versionSpec.project}/libs")
	}) {
		include '*.jar'
		exclude '*-sources.jar'
	}

	doLast {
		def expectedCount = versionMatrix.tracks.values().sum { it.versions.size() }
		def artifacts = destinationDir.listFiles({ file -> file.name.endsWith('.jar') } as FileFilter)
		if (artifacts == null || artifacts.size() != expectedCount) {
			throw new GradleException("Expected ${expectedCount} release Jars, found ${artifacts?.size() ?: 0}")
		}
	}
}

tasks.register('testAllVersions') {
	group = 'verification'
	description = 'Run tests for every declared Minecraft version in both build tracks.'
	dependsOn 'test121', 'test26x'
}
