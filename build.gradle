plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'com.github.spotbugs' version '6.1.7'
}

// SpotBugs 静态分析配置：发现潜在 bug、死代码、传参错误
spotbugs {
	effort = com.github.spotbugs.snom.Effort.MAX
	excludeFilter = file("$rootDir/spotbugs-exclude.xml")
}
spotbugsMain {
	reports {
		html.required = true
	}
	// 仅报告不阻塞构建，CI中检查 build/reports/spotbugs/main.html
	ignoreFailures = true
}
spotbugsTest {
	enabled = false // 测试代码不跑 SpotBugs
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.name}-mc${project.supported_minecraft_versions}"
}

loom {
	runs {
		client {
			runDir "run"
		}
		server {
			runDir "run"
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "FallenBreath"
				url = "https://maven.fallenbreath.me/releases"
			}
		}
		filter {
			includeGroup "me.fallenbreath"
		}
	}
	maven {
		name = "masa"
		url = "https://masa.dy.fi/maven/sakura-ryoko/"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	maven {
		name = "JitPack"
		url = "https://jitpack.io"
	}
	maven {
		name = "MoRanpcy"
		url = "https://maven.moranpcy.com/releases"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation include("com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}")
	modImplementation "maven.modrinth:malilib:${project.malilib_version}"
	modCompileOnly "maven.modrinth:litematica:${project.litematica_version}"
	modLocalRuntime "maven.modrinth:litematica:${project.litematica_version}"
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "me.fallenbreath:conditional-mixin-fabric:${project.conditional_mixin_version}"

	// ========== 测试框架 ==========
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.assertj:assertj-core:3.27.3"
	testImplementation "org.mockito:mockito-core:5.15.2"
	// ArchUnit 架构测试（包依赖、命名规范、分层检查）
	testImplementation "com.tngtech.archunit:archunit-junit5:1.4.0"
	
}

tasks.test {
	useJUnitPlatform()
	// 在 CI 或本地跑测试时输出中文不乱码
	systemProperty "file.encoding", "UTF-8"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		filter { line -> line.replace('${version}', project.version.toString()) }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
