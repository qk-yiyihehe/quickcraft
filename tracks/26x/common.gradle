apply from: rootProject.file('../../gradle/quickcraft-layout.gradle')
apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'
apply plugin: 'com.github.spotbugs'
apply plugin: 'com.replaymod.preprocess'
apply from: rootProject.file('../../gradle/quickcraft-source-roots.gradle')

layout.buildDirectory.set(new File(quickcraftBuildRoot, "targets/${project.name}"))

version = project.mod_version
group = project.maven_group

base {
	archivesName = "quickcraft-mc${project.supported_minecraft_versions}"
}

spotbugs {
	effort = com.github.spotbugs.snom.Effort.MAX
	toolVersion = '4.10.3'
	excludeFilter = rootProject.file('../../config/spotbugs/exclude.xml')
}

spotbugsMain {
	reports {
		html.required = true
	}
	ignoreFailures = true
}

spotbugsTest {
	enabled = false
}

loom {
	runs {
		client {
			runDir new File(quickcraftRunRoot, "${project.name}/client").absolutePath
			// 给 IDE 和构建进程保留内存，避免开发端按整机内存自动扩张堆。
			vmArgs '-Xms512m', '-Xmx3G'
		}
		server {
			runDir new File(quickcraftRunRoot, "${project.name}/server").absolutePath
		}
	}
}

if (System.getProperty('os.name').startsWith('Windows')) {
	tasks.withType(JavaExec).configureEach {
		doFirst {
			// VS Code 的 RUNASADMIN 标记会被普通权限 daemon 继承，导致创建 Java 进程时返回 740。
			environment.remove('__COMPAT_LAYER')
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'FallenBreath'
				url = 'https://maven.fallenbreath.me/releases'
			}
		}
		filter {
			includeGroup 'me.fallenbreath'
		}
	}
	maven {
		name = 'masa'
		url = 'https://masa.dy.fi/maven/sakura-ryoko/'
	}
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'JitPack'
		url = 'https://jitpack.io'
	}
	maven {
		name = 'MoRanpcy'
		url = 'https://maven.moranpcy.com/releases'
	}
}

def compatibilityOverride = project.findProperty('compat_target') == project.name
def malilibDependencyVersion = compatibilityOverride
	? project.property('compat_malilib_version')
	: project.malilib_version
def litematicaDependencyVersion = compatibilityOverride
	? project.property('compat_litematica_version')
	: project.litematica_version

// Loom 独立添加 Mixin；编译时保留单个 @Redirect.at 编码，兼容旧 Loader 的 MixinExtras。
configurations.compileClasspath {
	resolutionStrategy.force 'net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	include(implementation("com.github.Chocohead:Fabric-ASM:v${project.fabric_asm_version}"))
	implementation "maven.modrinth:malilib:${malilibDependencyVersion}"
	compileOnly "maven.modrinth:litematica:${litematicaDependencyVersion}"
	runtimeOnly "maven.modrinth:litematica:${litematicaDependencyVersion}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	runtimeOnly "me.fallenbreath:conditional-mixin-fabric:${project.conditional_mixin_version}"

	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.assertj:assertj-core:3.27.3'
	testImplementation 'org.mockito:mockito-core:5.18.0'
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
}

def deletedResources = file('deleted-resources.txt')
if (deletedResources.isFile()) {
	def excludes = deletedResources.readLines('UTF-8')
		.collect { it.trim() }
		.findAll { !it.isEmpty() && !it.startsWith('#') }
	sourceSets.main.resources.exclude(excludes)
}

tasks.test {
	useJUnitPlatform()
	systemProperty 'file.encoding', 'UTF-8'
	systemProperty 'quickcraft.sourceRoot', new File(quickcraftRepositoryRoot, 'tracks/26x/src/main/java').absolutePath
	workingDir = layout.buildDirectory.dir('test-runtime').get().asFile
	doFirst {
		workingDir.mkdirs()
		systemProperty 'quickcraft.testClasses', (sourceSets.main.output.classesDirs.files + sourceSets.test.output.classesDirs.files).collect { it.absolutePath }.join(File.pathSeparator)
		def gameLibraries = new File(workingDir, 'fabric-game-libraries.txt')
		gameLibraries.setText(classpath.files.collect { it.absolutePath }.join('\n'), 'UTF-8')
		systemProperty 'fabric.gameLibraries', '@' + gameLibraries.absolutePath
		systemProperty 'fabric.classPathGroups', sourceSets.main.output.asPath + File.pathSeparator + File.pathSeparator + sourceSets.test.output.asPath
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		filter { line -> line.replace('${version}', project.version.toString()) }
	}
}

// 材料替换测试直接使用可选 Litematica 的数据结构，与主源码使用相同解析依赖。
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from(rootProject.file('../../LICENSE')) {
		rename { "${it}_quickcraft" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}

def quickcraftSidebarTasks = ['compileJava', 'build', 'clean', 'runClient'] as Set
gradle.projectsEvaluated {
	tasks.configureEach { task ->
		task.group = quickcraftSidebarTasks.contains(task.name) ? '开发' : null
	}
}
