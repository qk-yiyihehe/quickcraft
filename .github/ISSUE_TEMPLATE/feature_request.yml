name: 功能建议
description: 提议 QuickCraft 的新功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: 请说明真实使用场景和期望工作流，避免只描述一个按钮或实现细节。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在游戏中遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望的操作流程、配置或热键行为。
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: 使用的 Minecraft 版本
      placeholder: "例如：1.21.1"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考实现
      description: 可选。请附上相关模组、截图或视频链接。
