# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: verify version matrix
        shell: pwsh
        run: ./scripts/verify-version-matrix.ps1
      - name: build
        run: ./gradlew collectArtifacts --console=plain
      - name: verify effective material resources
        shell: pwsh
        run: ./scripts/verify-material-replacement-resources.ps1
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/distributions/*.jar
          if-no-files-found: error
      - name: capture static analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SpotBugs
          path: build/targets/*/reports/spotbugs/
